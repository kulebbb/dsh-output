version: 2
updates:
  # 依赖（pnpm 走 npm 生态）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # 小版本和补丁合并成一个 PR，减少噪声；大版本单独评估
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # 插件运行在 DSH 宿主提供的 React 18 上，不能跟着升大版本
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      # 类型定义必须跟随 engines 里的 Node 主版本（当前 22），否则会对不上运行时
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions 用到的 action 版本
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
